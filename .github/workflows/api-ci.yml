name: ENJAZ API CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enjaz
          POSTGRES_PASSWORD: enjaz
          POSTGRES_DB: enjaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enjaz -d enjaz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://enjaz:enjaz@localhost:5432/enjaz_test
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Apply database migrations
        run: npm run migrate
      - name: Run API tests
        run: npm test
