name: Integrate Paperclip and Companies

on:
  push:
    branches:
      - integrate/paperclip-companies

permissions:
  contents: write

jobs:
  vendor-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ENJAZ integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate/paperclip-companies
          fetch-depth: 1

      - name: Download pinned upstream source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enjaz-upstream integrations/paperclip integrations/paperclip-companies
          curl --fail --location --retry 3 \
            https://codeload.github.com/paperclipai/paperclip/tar.gz/a1f77821b9cd5c9c846fdf7a0fa5cc620ad2b6bb \
            --output /tmp/paperclip.tar.gz
          curl --fail --location --retry 3 \
            https://codeload.github.com/paperclipai/companies/tar.gz/514503bf4f0ca88ebf16d5dc648e085d587f268f \
            --output /tmp/companies.tar.gz
          tar -xzf /tmp/paperclip.tar.gz -C /tmp/enjaz-upstream
          tar -xzf /tmp/companies.tar.gz -C /tmp/enjaz-upstream
          paperclip_dir="$(find /tmp/enjaz-upstream -mindepth 1 -maxdepth 1 -type d -name 'paperclip-*' | head -n 1)"
          companies_dir="$(find /tmp/enjaz-upstream -mindepth 1 -maxdepth 1 -type d -name 'companies-*' | head -n 1)"
          test -n "$paperclip_dir"
          test -n "$companies_dir"
          cp -a "$paperclip_dir"/. integrations/paperclip/
          cp -a "$companies_dir"/. integrations/paperclip-companies/
          test -f integrations/paperclip/package.json
          test -f integrations/paperclip-companies/README.md
          cat > integrations/README.md <<'EOF'
          # Vendored AI workforce sources

          This directory keeps upstream projects inside the ENJAZ monorepository without overwriting ENJAZ application files.

          - `paperclip/`: Paperclip source snapshot, upstream commit `a1f77821b9cd5c9c846fdf7a0fa5cc620ad2b6bb`.
          - `paperclip-companies/`: Paperclip Companies templates, upstream commit `514503bf4f0ca88ebf16d5dc648e085d587f268f`.

          These are vendored source snapshots, not yet a runtime integration. ENJAZ's root app, database schema, authentication, tenant isolation, deployment, and dependency graph have not been rewired to run Paperclip. Validate upstream licenses and third-party notices before commercial redistribution. Update each snapshot deliberately and review its changes before upgrading.
          EOF

      - name: Commit vendored source snapshots and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-paperclip.yml .integration-trigger
          git add integrations .github/workflows/integrate-paperclip.yml
          git commit -m "chore: vendor Paperclip and company templates"
          git push origin HEAD:integrate/paperclip-companies
