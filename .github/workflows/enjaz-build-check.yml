name: ENJAZ Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter enjaz-platform build
      - run: pnpm --filter enjaz-platform typecheck
