name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enjaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enjaz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: enjaz_test
      ENJAZ_CREDENTIALS_KEY: 0123456789abcdef0123456789abcdef
      NODE_ENV: test
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations from empty database
        run: npm run migrate
      - name: Run API tests
        run: npm test
