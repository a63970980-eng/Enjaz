name: ENJAZ Web CI
on:
  push:
    branches: [main, chore/reset-public-ui]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/e2e/**'
  pull_request:
    branches: [main, chore/reset-public-ui]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/e2e/**'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @enjaz/web test
      - run: pnpm --filter @enjaz/web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production preview
        run: pnpm --filter @enjaz/web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/enjaz-vite.log 2>&1 &
      - name: Wait for production preview
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/enjaz-vite.log
          exit 1
      - name: Run public E2E and accessibility gates
        env:
          ENJAZ_E2E_BASE_URL: http://127.0.0.1:4173
        run: pnpm exec playwright test
