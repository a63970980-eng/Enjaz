name: ENJAZ API Tests
on:
  push:
    paths:
      - 'services/api/**'
      - '.github/workflows/api-test.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package.json
      - run: npm install --ignore-scripts
      - run: npm test
