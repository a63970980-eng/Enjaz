name: ENJAZ build debug
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix apps/web --legacy-peer-deps --ignore-scripts
      - run: npm install --prefix services/api --legacy-peer-deps --ignore-scripts
      - run: npm run build --prefix apps/web
      - run: npx --yes esbuild@0.25.12 services/api/src/index.js --bundle --platform=node --format=cjs --outfile=api/server.cjs
