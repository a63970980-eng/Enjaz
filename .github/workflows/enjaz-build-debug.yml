name: ENJAZ build debug
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix apps/web --legacy-peer-deps --ignore-scripts
      - run: npm install --prefix services/api --legacy-peer-deps --ignore-scripts
      - name: Build web and capture log
        run: |
          set +e
          npm run build --prefix apps/web > build.log 2>&1
          code=$?
          cat build.log
          exit $code
      - name: Build API
        if: always()
        run: npx --yes esbuild@0.25.12 services/api/src/index.js --bundle --platform=node --format=cjs --outfile=api/server.cjs > api-build.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enjaz-build-logs
          path: |
            build.log
            api-build.log
