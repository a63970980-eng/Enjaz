<!doctype html>

<head>

<title>إنجاز | القوة العاملة الرقمية</title>

<style>
:root{--nav:#071a16;--nav2:#0c241e;--ink:#14201b;--muted:#718078;--line:#e2e8e4;--bg:#f6f8f6;--card:#fff;--gold:#d7b45a;--green:#17624b;--green2:#0e4938;--soft:#edf5f1;--danger:#a94343}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Cairo,sans-serif}button,input{font:inherit}button{cursor:pointer}#content{min-height:100vh}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,var(--nav),#0a211b);color:#dce9e3;padding:25px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.logo{padding:4px 10px 24px;border-bottom:1px solid #214137}.logo-mark{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:12px;background:#f4ead0;color:var(--nav);font-family:Cairo;font-weight:800;margin-left:9px}.logo strong{font-family:Cairo;font-size:22px}.logo small{display:block;color:#89a298;font-size:9px;letter-spacing:1.5px;margin-top:10px}.nav{padding-top:20px;display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#9db1a8;text-align:right;border-radius:10px;padding:11px 12px;font-size:12px;font-weight:600}.nav button:hover,.nav button.active{background:#12362c;color:#fff;border-color:#234a3e}.nav button.active:after{content:'›';float:left;color:var(--gold);font-size:18px;line-height:12px}.side-bottom{margin-top:auto;border-top:1px solid #214137;padding:17px 10px;color:#8fa49b;font-size:10px;line-height:1.8}.side-bottom b{display:block;color:#dce9e3;font-size:11px}.main{min-width:0;padding:30px clamp(18px,4vw,55px) 70px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.crumb{color:var(--muted);font-size:11px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#dfece6;color:var(--green);display:grid;place-items:center;font-weight:800}.page-title{margin-bottom:26px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--green)}h1{font-family:Cairo;margin:7px 0;font-size:31px;letter-spacing:-.5px}p{color:var(--muted)}.page-title p{font-size:13px;margin:5px 0;max-width:760px;line-height:1.8}.hero{background:linear-gradient(135deg,#0a2a21,#103f31);color:#fff;border-radius:20px;padding:30px;display:flex;justify-content:space-between;gap:30px;align-items:center;margin-bottom:22px;box-shadow:0 18px 50px rgba(7,26,22,.13)}.hero h2{font-family:Cairo;margin:0 0 8px;font-size:27px}.hero p{color:#b9cbc4;margin:0;line-height:1.9;font-size:12px;max-width:680px}.hero-stat{min-width:150px;text-align:center;border-right:1px solid #31574b;padding-right:30px}.hero-stat b{font:800 40px Cairo;color:#f5e6bc}.hero-stat span{display:block;color:#a7bbb3;font-size:10px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:25px 0 13px}.section-head h2{font-family:Cairo;margin:0;font-size:19px}.section-head p{margin:3px 0 0;font-size:11px}.search{width:min(330px,100%);border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;outline:0;font-size:11px}.search:focus{border-color:#87ad9d;box-shadow:0 0 0 3px #e7f1ed}.sectors{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.sector{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:right;min-height:120px;transition:.18s}.sector:hover,.sector.active{border-color:#78a18f;transform:translateY(-2px);box-shadow:0 10px 25px rgba(15,45,35,.07)}.sector .icon{font-size:23px}.sector b{display:block;font-family:Cairo;margin-top:9px;font-size:13px}.sector span:last-child{display:block;color:var(--muted);font-size:9px;line-height:1.7;margin-top:4px}.employee-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.employee{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;transition:.18s}.employee:hover{box-shadow:0 12px 28px rgba(15,45,35,.07);border-color:#9bb8aa}.emp-head{display:flex;align-items:center;gap:11px}.emp-icon{width:43px;height:43px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}.emp-head div:nth-child(2){min-width:0;flex:1}.emp-head b{display:block;font-family:Cairo;font-size:14px}.emp-head small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.ready{font-size:8px;color:#2e7359;background:#eaf5ef;padding:4px 7px;border-radius:20px;white-space:nowrap}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}.tags span{font-size:8px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;color:#65736c}.emp-foot{border-top:1px solid #edf1ee;padding-top:13px;display:flex;justify-content:space-between;align-items:center}.emp-foot small{font-size:9px;color:var(--muted)}.primary{border:0;background:var(--green);color:#fff;border-radius:8px;padding:9px 13px;font-size:10px;font-weight:700}.primary:hover{background:var(--green2)}.ghost{border:1px solid var(--line);background:#fff;color:#516059;border-radius:8px;padding:8px 12px;font-size:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat small{color:var(--muted);font-size:10px}.stat b{display:block;font:800 27px Cairo;margin-top:5px}.stat em{font-style:normal;color:#398063;font-size:9px}.workspace{display:grid;grid-template-columns:1.6fr 1fr;gap:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.list-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #edf1ee}.list-row:last-child{border-bottom:0}.list-row .grow{flex:1}.list-row b{font-size:11px}.list-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.status{font-size:8px;padding:4px 7px;border-radius:15px;background:#edf5f1;color:#33745b}.hidden{display:none!important}.empty{background:#fff;border:1px dashed #ccd8d1;border-radius:14px;padding:50px;text-align:center;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;background:#071a1680;backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(600px,100%);background:#fff;border-radius:17px;padding:24px;box-shadow:0 25px 80px #0003}.modal-card h2{font-family:Cairo;margin:0 0 6px}.modal-card p{font-size:11px;line-height:1.8}.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-start}.toast{position:fixed;left:22px;bottom:22px;background:#0b2921;color:#fff;padding:11px 15px;border-radius:9px;font-size:10px;box-shadow:0 12px 30px #0003;z-index:30}@media(max-width:1100px){.sectors{grid-template-columns:repeat(3,1fr)}.employee-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app-shell{display:block}.sidebar{position:static;height:auto;padding:13px}.logo{border:0;padding:5px 5px 12px}.logo small,.side-bottom{display:none}.nav{display:flex;overflow:auto;padding:0;gap:4px}.nav button{white-space:nowrap}.main{padding:20px 15px 45px}.hero{display:block;padding:22px}.hero-stat{border:0;border-top:1px solid #31574b;margin-top:20px;padding:15px 0 0}.stats{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.sectors{grid-template-columns:repeat(2,1fr)}.employee-grid{grid-template-columns:1fr}.section-head{display:block}.search{margin-top:10px}.topbar{margin-bottom:18px}}
</style>
