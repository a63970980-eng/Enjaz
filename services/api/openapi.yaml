openapi: 3.1.0
info:
  title: ENJAZ AI Workforce API
  version: 0.7.0
  description: Multi-tenant API for AI employees, tasks, workflows, approvals, integrations and audit events.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Workforce
  - name: Execution
  - name: Integrations
  - name: Operations
paths:
  /health:
    get:
      tags: [System]
      security: []
      responses:
        '200': {description: Healthy}
        '503': {description: Unhealthy}
  /api/v1:
    get:
      tags: [System]
      security: []
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiMetadata'}
  /api/v1/ops/health:
    get:
      tags: [Operations]
      summary: Operational health snapshot
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Operational snapshot}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/runtime/ops:
    get:
      tags: [Operations]
      summary: Runtime operations snapshot (manager permission required)
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Operational runtime snapshot}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tools:
    get:
      tags: [Workforce]
      summary: List registered tools
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200':
          description: Registered tools
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/workforce/roles:
    get:
      tags: [Workforce]
      summary: List active, versioned digital-employee role templates
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Active role templates with sector, objectives and least-privilege tool recommendations}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/industry-packs:
    get:
      tags: [Workforce]
      summary: List sector starter packs backed by active role templates
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Sector packs with role, team and starter-employee counts}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/industry-packs/{pack}/provision:
    post:
      tags: [Workforce]
      summary: Provision a workspace starter team within its subscription employee limit
      parameters:
        - name: pack
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Existing starter team returned for an idempotent request}
        '201': {description: Starter team provisioned}
        '400': {$ref: '#/components/responses/BadRequest'}
        '402': {description: Subscription inactive or employee quota exceeded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Pack has no active starter templates}
        '409': {description: Subscription is not configured or a partial earlier starter team needs reconciliation}
  /api/v1/departments:
    get:
      tags: [Workforce]
      summary: List teams belonging to the selected workspace
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Workspace teams and member counts}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Workforce]
      summary: Create a team in the selected workspace (manager only)
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartmentInput'}
      responses:
        '201': {description: Team created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Workspace was not found}
        '409': {description: A team with this name already exists in the workspace}
  /api/v1/employees:
    get:
      tags: [Workforce]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Employees}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Workforce]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeeInput'}
      responses:
        '201': {description: Employee created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tasks:
    get:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Tasks}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskInput'}
      responses:
        '201': {description: Task created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tasks/{taskId}/comments:
    get:
      tags: [Execution]
      summary: List task comments in the selected workspace
      parameters:
        - {$ref: '#/components/parameters/taskId'}
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Task comments}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Execution]
      summary: Add a comment (tasks.manage permission required)
      parameters:
        - {$ref: '#/components/parameters/taskId'}
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCommentInput'}
      responses:
        '201': {description: Comment created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Task was not found in the selected workspace}
  /api/v1/tasks/{taskId}/run:
    post:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/taskId'}
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunTaskInput'}
      responses:
        '200': {description: Task execution result}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/workflows:
    get:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Workflow execution summaries}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/approvals:
    get:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Approvals}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalInput'}
      responses:
        '201': {description: Approval created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/approvals/{approvalId}/{decision}:
    post:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/approvalId'}
        - name: decision
          in: path
          required: true
          schema: {type: string, enum: [approve, reject]}
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Approval decision and, for approval, execution result}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Approval not found}
  /api/v1/integrations:
    get:
      tags: [Integrations]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Integration connections; credentials are never returned}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Integrations]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationInput'}
      responses:
        '201': {description: Integration connection created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/integrations/{connectionId}/revoke:
    delete:
      tags: [Integrations]
      parameters:
        - {$ref: '#/components/parameters/connectionId'}
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Integration revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Integration connection not found}
  /api/v1/audit:
    get:
      tags: [Execution]
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
      responses:
        '200': {description: Audit events}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    workspaceId:
      name: workspaceId
      in: query
      required: true
      schema: {type: string, format: uuid}
    taskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, format: uuid}
    approvalId:
      name: approvalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    connectionId:
      name: connectionId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Workspace membership or named permission denied
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ApiMetadata:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        storage: {type: string}
        auth: {type: string}
        runtime: {type: string}
        integrations: {type: string}
        status: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        requestId: {type: string}
        code: {type: string, description: Stable machine-readable error code when available}
        permission: {type: string, description: Permission required when code is PERMISSION_REQUIRED}
    EmployeeInput:
      type: object
      required: [name, role]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        role: {type: string, minLength: 1, maxLength: 200}
        roleCode: {type: string, maxLength: 160, description: Stable code from the active workforce role catalog}
        departmentId: {type: string, format: uuid, description: Must identify a department in the same workspace}
        goal: {type: string, maxLength: 5000}
        mission: {type: string, maxLength: 5000}
        skills: {type: array, items: {type: string}}
        responsibilities: {type: array, items: {type: string}}
        tools: {type: array}
        permissions: {type: array}
        memory: {type: object}
        model: {type: string, maxLength: 200}
        budgetCents: {type: integer, minimum: 0}
        schedule: {type: object}
        status: {type: string, enum: [draft, active, paused, archived]}
        policy: {type: object}
    DepartmentInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 5000}
        managerEmployeeId: {type: [string, 'null'], format: uuid, description: Employee must be active and belong to the same workspace}
    TaskInput:
      type: object
      required: [employeeId, title, objective]
      properties:
        employeeId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 300}
        objective: {type: string, minLength: 1, maxLength: 10000}
        priority: {type: integer, minimum: 1, maximum: 10}
        input: {type: object}
    TaskCommentInput:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 10000}
        employeeId: {type: [string, 'null'], format: uuid}
    RunTaskInput:
      type: object
      properties:
        employeeId: {type: string, format: uuid}
        action: {type: string, maxLength: 200}
        input: {type: object}
    ApprovalInput:
      type: object
      required: [taskId, action]
      properties:
        taskId: {type: string, format: uuid}
        action: {type: string, maxLength: 200}
        reason: {type: string, maxLength: 5000}
        payload: {type: object}
    IntegrationInput:
      type: object
      required: [provider, name, credentials]
      properties:
        provider: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 200}
        displayName: {type: string, maxLength: 200}
        authType: {type: string, maxLength: 100}
        credentials: {type: object}
        scopes: {type: array, items: {type: string}}
        metadata: {type: object}
        config: {type: object}
        enabled: {type: boolean}
        expiresAt: {type: string, format: date-time}
    ToolListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              description: {type: string}
              risk: {type: string}
